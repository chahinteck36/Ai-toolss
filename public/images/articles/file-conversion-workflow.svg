<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="wf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="wf-node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="wf-arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <pattern id="wf-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="380" rx="16" fill="url(#wf-bg)" stroke="#334155" stroke-width="1.5" />
  <rect width="960" height="380" rx="16" fill="url(#wf-grid)" />

  <!-- Top Title Header -->
  <g transform="translate(480, 42)">
    <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      مسار التحويل الدائري للمستندات والوسائط (Document &amp; Image Lifecycle)
    </text>
    <text x="0" y="22" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">
      PDF ➔ DOCX ➔ JPG / PNG ➔ Unified PDF
    </text>
  </g>

  <!-- Node 1: PDF Source -->
  <g transform="translate(60, 110)">
    <rect width="180" height="190" rx="16" fill="url(#wf-node-grad)" stroke="#ef4444" stroke-width="2" stroke-opacity="0.8" />
    <!-- Step Badge -->
    <rect x="14" y="14" width="46" height="22" rx="6" fill="#ef4444" />
    <text x="37" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">01</text>
    
    <!-- Icon Placeholder -->
    <circle cx="90" cy="72" r="28" fill="#ef4444" fill-opacity="0.15" />
    <path d="M78 60 H96 L104 68 V84 H78 Z" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" />
    <text x="90" y="76" fill="#ef4444" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">PDF</text>
    
    <text x="90" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">مستند PDF الأصلي</text>
    <text x="90" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">طبقات نصوص وجداول</text>
    <rect x="25" y="160" width="130" height="18" rx="4" fill="#1e293b" />
    <text x="90" y="173" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Vector Text Fixed</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(248, 195)">
    <path d="M 0 0 L 32 0" stroke="url(#wf-arrow-grad)" stroke-width="3" stroke-dasharray="4 4" />
    <polygon points="38,0 28,-5 28,5" fill="#8b5cf6" />
  </g>

  <!-- Node 2: DOCX Editable -->
  <g transform="translate(290, 110)">
    <rect width="180" height="190" rx="16" fill="url(#wf-node-grad)" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.8" />
    <rect x="14" y="14" width="46" height="22" rx="6" fill="#3b82f6" />
    <text x="37" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">02</text>
    
    <circle cx="90" cy="72" r="28" fill="#3b82f6" fill-opacity="0.15" />
    <path d="M76 62 L82 82 L90 68 L98 82 L104 62" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <text x="90" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">ملف Word (DOCX)</text>
    <text x="90" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">تحرير وإعادة صياغة</text>
    <rect x="25" y="160" width="130" height="18" rx="4" fill="#1e293b" />
    <text x="90" y="173" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">BiDi Arabic RTL</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(478, 195)">
    <path d="M 0 0 L 32 0" stroke="url(#wf-arrow-grad)" stroke-width="3" stroke-dasharray="4 4" />
    <polygon points="38,0 28,-5 28,5" fill="#8b5cf6" />
  </g>

  <!-- Node 3: JPG / PNG Images -->
  <g transform="translate(520, 110)">
    <rect width="180" height="190" rx="16" fill="url(#wf-node-grad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.8" />
    <rect x="14" y="14" width="46" height="22" rx="6" fill="#10b981" />
    <text x="37" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">03</text>
    
    <circle cx="90" cy="72" r="28" fill="#10b981" fill-opacity="0.15" />
    <rect x="76" y="60" width="28" height="24" rx="4" stroke="#10b981" stroke-width="2" fill="none" />
    <circle cx="83" cy="67" r="2.5" fill="#10b981" />
    <path d="M77 78 L85 71 L97 81" stroke="#10b981" stroke-width="1.5" fill="none" />
    
    <text x="90" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">صور JPG / PNG</text>
    <text x="90" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">استخراج الصفحات والنقاء</text>
    <rect x="25" y="160" width="130" height="18" rx="4" fill="#1e293b" />
    <text x="90" y="173" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">High-Res Raster 300DPI</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(708, 195)">
    <path d="M 0 0 L 32 0" stroke="url(#wf-arrow-grad)" stroke-width="3" stroke-dasharray="4 4" />
    <polygon points="38,0 28,-5 28,5" fill="#8b5cf6" />
  </g>

  <!-- Node 4: Reassembled Final PDF -->
  <g transform="translate(750, 110)">
    <rect width="160" height="190" rx="16" fill="url(#wf-node-grad)" stroke="#a855f7" stroke-width="2" stroke-opacity="0.8" />
    <rect x="14" y="14" width="46" height="22" rx="6" fill="#a855f7" />
    <text x="37" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">04</text>
    
    <circle cx="80" cy="72" r="28" fill="#a855f7" fill-opacity="0.15" />
    <path d="M68 62 H86 L92 68 V82 H68 Z" fill="none" stroke="#a855f7" stroke-width="2" stroke-linejoin="round" />
    <path d="M74 74 L78 78 L88 68" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="80" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">PDF نهائي موحد</text>
    <text x="80" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">جاهز للطباعة والرفع</text>
    <rect x="20" y="160" width="120" height="18" rx="4" fill="#1e293b" />
    <text x="80" y="173" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Standardized A4</text>
  </g>

  <!-- Return Flow Curve (Bottom loop back from 4 to 1) -->
  <path d="M 830 310 C 830 355, 150 355, 150 310" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <polygon points="145,310 150,300 155,310" fill="#6366f1" />
  <rect x="420" y="336" width="120" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="480" y="351" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">دورة تحويل مستمرة</text>
</svg>
