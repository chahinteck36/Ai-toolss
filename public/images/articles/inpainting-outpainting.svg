<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="io-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#181336" />
    </linearGradient>
    <linearGradient id="io-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="io-inpaint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="io-outpaint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="io-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect width="960" height="440" rx="18" fill="url(#io-bg)" stroke="#334155" stroke-width="1.5" />
  <rect width="960" height="440" rx="18" fill="url(#io-grid)" />

  <!-- Top Title Header -->
  <g transform="translate(480, 42)">
    <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      تقنيات التعديل التوليدي: الفرق بين Inpainting وOutpainting
    </text>
    <text x="0" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">
      التحكم الدقيق في تفاصيل الصورة وتمديد أبعادها دون إعادة التوليد من الصفر
    </text>
  </g>

  <!-- Left Card: Inpainting (التعديل الداخلي بالفرشاة) -->
  <g transform="translate(50, 95)">
    <rect width="410" height="310" rx="16" fill="url(#io-card-bg)" stroke="#ec4899" stroke-width="2" stroke-opacity="0.7" />
    
    <!-- Header Badge -->
    <rect x="20" y="20" width="110" height="26" rx="8" fill="#ec4899" />
    <text x="75" y="37" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">1. Inpainting</text>
    <text x="145" y="38" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">التعديل بالفرشاة</text>

    <!-- Canvas Simulation -->
    <g transform="translate(30, 65)">
      <!-- Main Picture Frame -->
      <rect width="350" height="150" rx="12" fill="#090d16" stroke="#475569" stroke-width="1" />
      
      <!-- Landscape Elements (Mountains & Sky) -->
      <polygon points="40,150 140,70 240,150" fill="#1e1b4b" opacity="0.8" />
      <polygon points="180,150 270,90 340,150" fill="#312e81" opacity="0.6" />
      
      <!-- Preserved Area Label -->
      <text x="70" y="35" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">المحيط الأصلي (محمي)</text>

      <!-- Target Brush Selection (Masked Area) -->
      <rect x="130" y="45" width="90" height="90" rx="10" fill="url(#io-inpaint-grad)" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 4" />
      
      <!-- Brush cursor icon -->
      <circle cx="175" cy="90" r="16" fill="#ec4899" fill-opacity="0.3" />
      <path d="M170 95 L182 83 L186 87 L174 99 Z" fill="#f472b6" />
      <circle cx="168" cy="97" r="2.5" fill="#f472b6" />

      <!-- Replacement Indicator Tag -->
      <rect x="135" y="115" width="80" height="16" rx="4" fill="#0f172a" stroke="#ec4899" stroke-width="0.75" />
      <text x="175" y="127" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">تعديل العنصر هنا</text>
    </g>

    <!-- Bottom Technical Explanations -->
    <g transform="translate(30, 230)">
      <rect width="350" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
        • عزل جزء محدد بالفرشاة مع ثبات باقي المشهد 100%
      </text>
      <text x="15" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
        • دمج العنصر الجديد تلقائياً مع زوايا الإضاءة والظلال الأصلية
      </text>
    </g>
  </g>

  <!-- Right Card: Outpainting (توسيع الإطار الخارجي) -->
  <g transform="translate(500, 95)">
    <rect width="410" height="310" rx="16" fill="url(#io-card-bg)" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.7" />
    
    <!-- Header Badge -->
    <rect x="20" y="20" width="116" height="26" rx="8" fill="#3b82f6" />
    <text x="78" y="37" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">2. Outpainting</text>
    <text x="150" y="38" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="13" font-weight="700">توسيع الإطار الخارجي</text>

    <!-- Canvas Simulation -->
    <g transform="translate(30, 65)">
      <!-- Outer Extended Canvas Boundaries (Dashed) -->
      <rect width="350" height="150" rx="12" fill="url(#io-outpaint-grad)" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 6" />

      <!-- Original Central Image -->
      <rect x="95" y="15" width="160" height="120" rx="8" fill="#090d16" stroke="#f59e0b" stroke-width="2" />
      
      <!-- Central Artwork Silhouette -->
      <circle cx="175" cy="55" r="22" fill="#7c3aed" opacity="0.8" />
      <polygon points="125,135 175,85 225,135" fill="#1e1b4b" />
      
      <!-- Central Tag -->
      <rect x="110" y="22" width="130" height="16" rx="4" fill="#0f172a" />
      <text x="175" y="34" fill="#fde68a" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">الصورة الأصلية (1:1)</text>

      <!-- Expand Arrows Left -->
      <g transform="translate(50, 75)">
        <path d="M 30 0 L 0 0" stroke="#60a5fa" stroke-width="2.5" />
        <polygon points="-4,0 4,-4 4,4" fill="#60a5fa" />
        <text x="15" y="-10" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">تمديد المشهد</text>
      </g>

      <!-- Expand Arrows Right -->
      <g transform="translate(265, 75)">
        <path d="M 0 0 L 30 0" stroke="#60a5fa" stroke-width="2.5" />
        <polygon points="34,0 26,-4 26,4" fill="#60a5fa" />
        <text x="15" y="-10" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">إكمال الأفق</text>
      </g>
    </g>

    <!-- Bottom Technical Explanations -->
    <g transform="translate(30, 230)">
      <rect width="350" height="60" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="15" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
        • توسيع أفق الصورة لتتحول من عمودية إلى بانوراما عريضة 16:9
      </text>
      <text x="15" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
        • استكمال الخلفية الطبيعية أو المعمارية بتماسك بصري تام
      </text>
    </g>
  </g>
</svg>
