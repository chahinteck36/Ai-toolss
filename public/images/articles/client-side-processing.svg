<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="csp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="csp-browser-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="csp-wasm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <pattern id="csp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Base container -->
  <rect width="880" height="340" rx="16" fill="url(#csp-bg)" stroke="#334155" stroke-width="1.5" />
  <rect width="880" height="340" rx="16" fill="url(#csp-grid)" />

  <!-- Outer Browser Mockup Window -->
  <g transform="translate(180, 40)">
    <rect width="520" height="260" rx="14" fill="url(#csp-browser-bg)" stroke="#6366f1" stroke-width="2" />
    
    <!-- Browser Title Bar -->
    <rect width="520" height="34" rx="14" fill="#0f172a" />
    <rect y="20" width="520" height="14" fill="#0f172a" />
    <line x1="0" y1="34" x2="520" y2="34" stroke="#334155" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="4.5" fill="#10b981" />

    <!-- URL Bar -->
    <rect x="75" y="8" width="370" height="18" rx="9" fill="#1e293b" />
    <circle cx="88" cy="17" r="3" fill="#10b981" />
    <text x="100" y="21" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">https://adawatai.online (Local Browser Sandbox)</text>

    <!-- Inside Browser Window Content -->
    <!-- WASM Engine Core -->
    <g transform="translate(260, 140)">
      <circle r="52" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4" />
      <circle r="38" fill="url(#csp-wasm-grad)" />
      <!-- WASM Icon / Chip -->
      <path d="M-14 -10 L-6 14 L0 4 L6 14 L14 -10" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="0" y="26" fill="#c7d2fe" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">WebAssembly</text>
    </g>

    <!-- Flow Arrow Left to WASM -->
    <g transform="translate(110, 140)">
      <path d="M 0 0 L 85 0" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4 4" />
      <polygon points="90,0 82,-4 82,4" fill="#6366f1" />
      <text x="45" y="-10" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">معالجة داخلية</text>
    </g>

    <!-- Flow Arrow WASM to Right -->
    <g transform="translate(325, 140)">
      <path d="M 0 0 L 85 0" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 4" />
      <polygon points="90,0 82,-4 82,4" fill="#10b981" />
      <text x="45" y="-10" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">تصدير فوري</text>
    </g>
  </g>

  <!-- Left: Input File -->
  <g transform="translate(30, 95)">
    <rect width="120" height="150" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M40 30 H75 L85 40 V105 H40 Z" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" />
    <text x="60" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ملف المصدر</text>
    <text x="60" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">PDF / DOCX / IMG</text>
    <rect x="15" y="115" width="90" height="20" rx="6" fill="#0f172a" />
    <text x="60" y="129" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">الملف من جهازك</text>
  </g>

  <!-- Arrow Input -> Browser -->
  <g transform="translate(152, 170)">
    <path d="M 0 0 L 25 0" stroke="#6366f1" stroke-width="2.5" />
    <polygon points="28,0 20,-4 20,4" fill="#6366f1" />
  </g>

  <!-- Right: Output File -->
  <g transform="translate(730, 95)">
    <rect width="120" height="150" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <circle cx="60" cy="45" r="16" fill="#10b981" fill-opacity="0.2" />
    <path d="M52 45 L58 51 L68 41" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="82" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">الملف المحول</text>
    <text x="60" y="98" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">تحميل مباشر</text>
    <rect x="15" y="115" width="90" height="20" rx="6" fill="#047857" />
    <text x="60" y="129" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">حفظ في الجهاز</text>
  </g>

  <!-- Arrow Browser -> Output -->
  <g transform="translate(702, 170)">
    <path d="M 0 0 L 25 0" stroke="#10b981" stroke-width="2.5" />
    <polygon points="28,0 20,-4 20,4" fill="#10b981" />
  </g>

  <!-- Bottom: Crossed-out Remote Server (Zero Data Leakage) -->
  <g transform="translate(440, 312)">
    <rect x="-170" y="-12" width="340" height="24" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
    <!-- Small server icon -->
    <rect x="-155" y="-7" width="14" height="10" rx="2" fill="#334155" />
    <line x1="-158" y1="-9" x2="-138" y2="5" stroke="#ef4444" stroke-width="1.5" />
    <text x="10" y="4" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      لا يتم إرسال أي ملفات إلى سيرفرات خارجية (0% Cloud Upload)
    </text>
  </g>
</svg>
